name: CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # cache: pnpm 让 setup-node 缓存 pnpm 全局 store（~/.local/share/pnpm/store），
      # key 由 pnpm-lock.yaml 派生，命中后 pnpm install 仅做 link，不再走网络下载。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome check 同时校验 lint 规则与格式化差异（formatter 差异按 error 处理）
      - name: Lint & Format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (web)
        run: pnpm typecheck:web

      # 双 reporter：default 保留可读的控制台输出；github-actions 在失败时
      # 为每条失败用例标注对应源文件/行号（workflow run summary 的 annotations）。
      - name: Test
        id: test
        run: pnpm test --reporter=default --reporter=github-actions

      - name: Build
        run: pnpm build

name: CI

on:
  # push 仅 main：非 main 分支的 push 已由 pull_request 事件覆盖
  # （push 到 PR 分支会自动触发 PR run），保留 branches:"*" 会让
  # 同一 commit 跑两次全量（push run + PR run）。
  push:
    branches: [main]
  pull_request:
    branches: "*"

jobs:
  # 静态检查与构建：与 test 无依赖，并行执行以缩短关键路径。
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # cache: pnpm 让 setup-node 缓存 pnpm 全局 store（~/.local/share/pnpm/store），
      # key 由 pnpm-lock.yaml 派生，命中后 pnpm install 仅做 link，不再走网络下载。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome check 同时校验 lint 规则与格式化差异（formatter 差异按 error 处理）
      - name: Lint & Format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck (web)
        run: pnpm typecheck:web

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 双 reporter：default 保留可读的控制台输出；github-actions 在失败时
      # 为每条失败用例标注对应源文件/行号（workflow run summary 的 annotations）。
      #
      # 优先只跑受影响测试（vitest 依赖图分析，实测改 1 个核心模块可追踪
      # 到数十个下游测试文件）。以下情况回退全量：
      # - base ref 缺失（push 事件无 base_ref、fork PR、浅克隆未含 base）
      # - 无 src 改动（纯文档 PR、push 到 main 自身）
      # 守卫必要：--changed 在无受影响文件时静默 exit 0（零测试假绿）。
      - name: Test
        id: test
        timeout-minutes: 15
        run: |
          BASE_BRANCH="${{ github.base_ref || 'main' }}"
          # 只拉 base 分支 tip（diff 仅需其 tree，无需共同历史）
          git fetch --depth=1 origin "$BASE_BRANCH" >/dev/null 2>&1 || true
          BASE="origin/$BASE_BRANCH"
          if git rev-parse --verify "$BASE" >/dev/null 2>&1 \
             && [ -n "$(git diff --name-only "$BASE" -- src)" ]; then
            pnpm test --changed "$BASE" --reporter=default --reporter=github-actions
          else
            pnpm test --reporter=default --reporter=github-actions
          fi

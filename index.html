<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 允许移动端捏合缩放：user-scalable=no / maximum-scale=1.0 会禁掉双指缩放，
         低视力用户在手机上无法放大正文（WCAG 2.1 SC 1.4.4 Resize Text，axe
         meta-viewport）。viewport-fit=cover 保留，底部安全区仍由 env(safe-area-*) 处理。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>c0de-agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/web/main.tsx"></script>
  </body>
</html>
